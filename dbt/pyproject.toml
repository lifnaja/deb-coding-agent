[tool.poetry]
# Dependency management only; this directory is a dbt project, not a Python
# package. Docs live in the repository root README.md.
package-mode = false
name = "currency-dbt"
version = "0.1.0"
description = "dbt transformations for currency data in BigQuery"
authors = ["Data Engineering Team <data@example.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
dbt-bigquery = "^1.12.0"

[tool.poetry.group.dev.dependencies]
# .sqlfluff uses the jinja templater, so sqlfluff-templater-dbt is not needed
sqlfluff = "^3.4.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
