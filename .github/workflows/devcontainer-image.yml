name: Publish devcontainer image

on:
  push:
    branches: [main]
    paths:
      - .github/devcontainer-image/**
      - .github/workflows/devcontainer-image.yml
      # The image bakes these in; a stale image quietly costs startup time.
      - dbt/pyproject.toml
      - dbt/poetry.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'lifnaja/deb-gen-ai-playground' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Stage the dbt dependency files into the build context
        run: cp dbt/pyproject.toml dbt/poetry.lock .github/devcontainer-image/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and test before publishing
        uses: devcontainers/ci@v0.3
        with:
          configFile: .github/devcontainer-image/devcontainer.json
          imageName: ghcr.io/lifnaja/deb-gen-ai-playground-devcontainer
          imageTag: 1,sha-${{ github.sha }}
          cacheFrom: ghcr.io/lifnaja/deb-gen-ai-playground-devcontainer:1
          platform: linux/amd64
          push: always
          runCmd: |
            set -eu
            python -c 'import sys; assert sys.version_info[:2] == (3, 12)'
            poetry --version
            ruff --version
            dbt --version
            sqlfluff --version
            gcloud --version
            docker compose version
            # The point of baking the dependencies in: this must find nothing
            # to do, or a codespace pays the full install on creation.
            cd dbt
            poetry install --no-interaction | tee /tmp/poetry-install.log
            grep -q 'No dependencies to install or update' /tmp/poetry-install.log
            cd ..
            timeout 60 bash -c 'until docker info >/dev/null 2>&1; do sleep 2; done'
            docker run --rm hello-world
